<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fairteilen</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #f1f5f9; }
      }
      h1 { font-size: 1.25rem; margin: 0; }
      p { margin: 0; max-width: 24rem; color: #64748b; font-size: 0.95rem; }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: #2f9e6f;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div style="font-size: 3rem" aria-hidden="true">🤝</div>
    <h1>Keine Verbindung</h1>
    <p>
      Fairteilen konnte den Server nicht erreichen. Prüfe deine Internetverbindung und versuche es
      noch einmal.
    </p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </body>
</html>
