services:
  fairteilen:
    build: .
    ports:
      - "3000:3000"
    environment:
      # SQLite in einem Volume – für kleine bis mittlere Instanzen völlig ausreichend.
      DATABASE_URL: "file:/data/fairteilen.db"
      AUTH_SECRET: "${AUTH_SECRET:?bitte in .env setzen: openssl rand -base64 48}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      # Optional: Anmeldung über Google / Apple
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_TEAM_ID: "${APPLE_TEAM_ID:-}"
      APPLE_KEY_ID: "${APPLE_KEY_ID:-}"
      APPLE_PRIVATE_KEY: "${APPLE_PRIVATE_KEY:-}"
    volumes:
      - fairteilen-data:/data
    restart: unless-stopped

volumes:
  fairteilen-data:
